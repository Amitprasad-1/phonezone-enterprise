<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brand blue/cyan gradient -->
    <linearGradient id="pz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    
    <!-- Mask to cut out P and Z from the phone frame -->
    <mask id="phone-mask">
      <!-- White background makes everything visible by default -->
      <rect x="-10" y="-10" width="120" height="120" fill="white" />
      
      <!-- Black P shape with thick stroke to cut it out of the phone frame -->
      <path fill="black" stroke="black" stroke-width="6" fill-rule="evenodd" d="
        M 28 72 
        L 28 28 
        L 50 28 
        C 57 28, 59 32, 59 38 
        C 59 44, 57 48, 50 48 
        L 36 48 
        L 36 72 
        Z 
        M 36 34 
        L 36 42 
        L 48 42 
        C 51 42, 52 40, 52 38 
        C 52 36, 51 34, 48 34 
        Z
      " />
      
      <!-- Black Z shape with thick stroke to cut it out of the phone frame -->
      <path fill="black" stroke="black" stroke-width="6" d="
        M 44 46 
        L 72 46 
        L 68 54 
        L 58 54 
        L 46 72 
        L 66 72 
        L 62 80 
        L 32 80 
        L 36 72 
        L 48 54 
        Z
      " />
    </mask>

    <!-- Mask to cut out Z from the white P letter -->
    <mask id="p-mask">
      <rect x="-10" y="-10" width="120" height="120" fill="white" />
      <!-- Cut out Z with a 5px stroke gap -->
      <path fill="black" stroke="black" stroke-width="5" d="
        M 44 46 
        L 72 46 
        L 68 54 
        L 58 54 
        L 46 72 
        L 66 72 
        L 62 80 
        L 32 80 
        L 36 72 
        L 48 54 
        Z
      " />
    </mask>
  </defs>
  
  <g transform="rotate(-10 50 50)">
    <!-- Tilted Phone Group (Masked to cut out holes where P and Z are) -->
    <g mask="url(#phone-mask)">
      <rect x="22" y="10" width="42" height="80" rx="8" fill="none" stroke="url(#pz-grad)" stroke-width="4" />
      
      <!-- Phone Speaker notch -->
      <line x1="38" y1="16" x2="48" y2="16" stroke="url(#pz-grad)" stroke-width="3" stroke-linecap="round" />
      
      <!-- Phone Home line -->
      <line x1="39" y1="84" x2="47" y2="84" stroke="url(#pz-grad)" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <!-- White Stylized "P" (Masked to cut a gap around the Z) -->
    <path fill="#ffffff" fill-rule="evenodd" mask="url(#p-mask)" d="
      M 28 72 
      L 28 28 
      L 50 28 
      C 57 28, 59 32, 59 38 
      C 59 44, 57 48, 50 48 
      L 36 48 
      L 36 72 
      Z 
      M 36 34 
      L 36 42 
      L 48 42 
      C 51 42, 52 40, 52 38 
      C 52 36, 51 34, 48 34 
      Z
    " />
    
    <!-- Gradient Stylized "Z" -->
    <path fill="url(#pz-grad)" d="
      M 44 46 
      L 72 46 
      L 68 54 
      L 58 54 
      L 46 72 
      L 66 72 
      L 62 80 
      L 32 80 
      L 36 72 
      L 48 54 
      Z
    " />
  </g>
</svg>
